# SMD Linux - serial console login for the test harness and for headless use.
#
# The boot loader enables console=ttyS0 on the kernel command line, which makes
# the kernel log there, but systemd only spawns a getty on a serial console it
# can find.  The instance is enabled explicitly so an installed system offers a
# login prompt on the serial port too - that is how the automated tests reach
# the installed machine.
#
# On a laptop without a serial port the condition below keeps the unit from
# failing: it is skipped instead of appearing as a broken service.
[Unit]
ConditionPathExists=/dev/ttyS0
