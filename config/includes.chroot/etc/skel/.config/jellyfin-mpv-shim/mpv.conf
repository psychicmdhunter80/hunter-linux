# SMD Linux - mpv settings for Jellyfin Media Player (MPV Shim).
#
# The shim decoded in software by default, which dropped frames on the
# Chromebook's Bay Trail graphics.  The ISO ships Debian's i965 VA-API driver,
# and auto-safe lets mpv pick VA-API when it is available and fall back to
# software otherwise, so the same file is safe on machines without it.
hwdec=auto-safe

# display-resample was tried on the Chromebook and made frame dropping worse, so
# it is deliberately not set.
