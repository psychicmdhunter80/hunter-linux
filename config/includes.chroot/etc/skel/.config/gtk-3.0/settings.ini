[Settings]
# SMD Linux - dark interface for the panel, the whisker menu and every GTK3
# application.  Adwaita-dark is the Adwaita theme's own dark variant; it is
# shipped by gnome-themes-extra, which 1.1 had removed, so until 1.3 the theme
# name below silently fell back to light Adwaita - the white panel buttons and
# the white application menu in the 1.2 screenshots.
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Adwaita
gtk-font-name=DejaVu Sans 10
gtk-application-prefer-dark-theme=1
gtk-menu-images=1
gtk-button-images=0
gtk-enable-animations=0
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-dialogs-use-header=0
