# SMD Linux - PipeWire scheduling quantum.
#
# On the Chromebook (Bay Trail, chtmax98090) Jellyfin's audio could start with
# several seconds of silence.  The kernel log showed repeated ALSA XRUNs and
# PipeWire reporting "snd_pcm_avail after recover: Broken pipe": the default
# quantum was too small for that hardware to keep up.
#
# A forced quantum of 2048 removed the delay on a live test and survived a
# reboot on the installed system, so it is pinned here.  min and max are set to
# the same value so nothing can shrink it back at runtime.
context.properties = {
    default.clock.quantum = 2048
    default.clock.min-quantum = 2048
    default.clock.max-quantum = 2048
}
