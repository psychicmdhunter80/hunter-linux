# SMD Linux - the loading screen shown between the boot menu and the desktop.
#
# ShowDelay=0 means the screen appears immediately instead of after the
# default pause, which is exactly the blinking-cursor time this replaces.
# DeviceTimeout is generous on purpose: a slow USB stick must not make
# plymouth give up and drop to text on a machine that can show the screen.
[Daemon]
Theme=smd
ShowDelay=0
DeviceTimeout=8
