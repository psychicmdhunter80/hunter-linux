---
# SMD Linux 1.0 - Calamares installer configuration.
#
# Module settings live in /etc/calamares/modules, branding in
# /etc/calamares/branding/hunter.  The installer runs from the live system
# and unpacks /run/live/medium/live/filesystem.squashfs, so it works
# completely offline.
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
# Phase 1 - questions
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

# Phase 2 - installation
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - packages
  - shellprocess
  - initramfs
  - umount

# Phase 3 - done
- show:
  - finished

branding: hunter
prompt-install: false
dont-chroot: false
