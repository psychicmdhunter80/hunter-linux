---
# SMD Linux 1.0 - partitioning.
#
# Nothing is written to a disk until the user confirms the summary page.
# Automatic, manual ("Something else") and side-by-side (existing Windows)
# installations are all offered by the partition module.
efiSystemPartition: "/boot/efi"
userSwapChoices:
    - none
    - small
    - file
initialSwapChoice: none
drawNestedPartitions: false
defaultFileSystemType: "ext4"
enableLuksAutomatedPartitioning: true
allowManualPartitioning: true
