---
# Hunter Linux 1.0 - boot loader installation.
#
# BIOS machines get GRUB in the MBR of the target disk.
# UEFI machines get Debian's signed shim + signed GRUB ("sb-shim"), which is
# the same signed chain the live ISO uses, so an installed system also boots
# with Secure Boot enabled.  shim-signed and grub-efi-amd64-signed are part of
# the installed package set.
efiBootLoader: "sb-shim"

# systemd-boot settings (unused, kept for completeness)
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "10"

# GRUB 2 names used on Debian
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Also install the removable-media fallback loader /EFI/BOOT/BOOTX64.EFI,
# which some firmware needs in order to see the new entry.
installEFIFallback: true
