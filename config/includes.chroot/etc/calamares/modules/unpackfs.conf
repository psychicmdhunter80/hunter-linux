---
# SMD Linux 1.0 - copy the live system onto the target.
# The same squashfs that the live session runs from is unpacked to /,
# which is what makes the installed system identical to the live one and
# lets installation work without a network connection.
unpack:
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
