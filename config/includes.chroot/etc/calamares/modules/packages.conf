---
# Hunter Linux 1.0 - the live-session packages have no meaning on an
# installed system.  Calamares itself is purged by hunter-postinstall, together
# with the live user's sudo rule and autologin configuration.
backend: apt

operations:
  - remove:
      - live-boot
      - live-boot-initramfs-tools
      - live-config
      - live-config-systemd
      - live-tools
