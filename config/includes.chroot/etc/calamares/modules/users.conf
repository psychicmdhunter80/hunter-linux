---
# Hunter Linux 1.0 - the account the installer creates.
#
# passwordRequirements deliberately does not use libpwquality: its dictionary
# check needs /var/cache/cracklib/cracklib_dict.pwd, which is not part of the
# image, and Calamares then refuses *every* password with "error loading
# dictionary".  Without the dictionary check a non-empty password is accepted,
# which is what a live installer wants.
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
