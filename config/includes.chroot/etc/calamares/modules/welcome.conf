---
# Hunter Linux 1.0 - prerequisites for installation.
# No internet connection is required: the installer unpacks the live image.
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false

requirements:
    requiredStorage: 8
    requiredRam: 1.5
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
