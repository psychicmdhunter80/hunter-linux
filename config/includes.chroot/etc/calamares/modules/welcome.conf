---
# Hunter Linux 1.0 - prerequisites for installation.
# No internet connection is required: the installer unpacks the live image.
#
# The "power" check (battery / mains) is deliberately not used: Hunter Linux
# also runs on desktops and in virtual machines, where there is no battery and
# the check fails for no useful reason.
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false

requirements:
    requiredStorage: 8
    requiredRam: 1.5
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - ram
        - root
