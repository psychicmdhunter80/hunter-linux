---
# Hunter Linux 1.0 - install the boot loader and finish the installation
# inside the target system.  The first script installs GRUB (the installer's
# own bootloader module depends on grub-mkconfig, which fails in this image),
# the second removes live-only configuration, purges the remaining live
# packages and the installer, and rebuilds the initramfs.
dontChroot: false
timeout: 900
verbose: true

script:
    - "/usr/local/sbin/hunter-bootloader"
    - "/usr/local/sbin/hunter-postinstall"
