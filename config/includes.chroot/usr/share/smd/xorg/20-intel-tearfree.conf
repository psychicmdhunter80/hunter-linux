# SMD Linux - Intel TearFree configuration.
#
# Installed as /etc/X11/xorg.conf.d/20-intel.conf by hunter-graphics, and only
# when the machine actually has the Intel graphics this image was tested with
# (Bay Trail / ValleyView, PCI 8086:0f31, 0f32 and 0f33) and the Intel DDX is
# present.  On every other machine the file is removed, so this ISO never
# forces the intel driver onto unrelated graphics hardware.
#
# Tearing comes from having no compositor under i3.  TearFree removes it inside
# the driver, with no extra process and no extra memory - which matters on a
# 2 GB machine.
#
# To remove it on a specific machine:
#     sudo rm /etc/X11/xorg.conf.d/20-intel.conf && sudo systemctl restart lightdm
# Confirm it is active with:
#     grep -i tearfree /var/log/Xorg.0.log

Section "Device"
	Identifier "Intel Graphics"
	Driver     "intel"
	Option     "TearFree" "true"
EndSection
