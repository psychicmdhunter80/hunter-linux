# SMD Linux - boot menu screen for the legacy BIOS / CSM path.
#
# live-build substitutes @APPEND_LIVE@ and @APPEND_LIVE_FAILSAFE@ in every
# *.cfg file here from LB_BOOTAPPEND_LIVE / LB_BOOTAPPEND_LIVE_FAILSAFE
# (see auto/config).  The kernel and initrd paths are literal because
# live-build only expands @LINUX@/@INITRD@ inside live.cfg.in.
menu hshift 0
menu width 82

menu title SMD LINUX 1.1
include stdmenu.cfg
include live.cfg

menu begin advanced
	menu label ^Advanced Boot Options
	menu title Advanced Boot Options
	include stdmenu.cfg
	label mainmenu
		menu label ^Back..
		menu exit
	label hunter-verbose
		menu label Start SMD Linux Live (^verbose boot)
		linux /live/vmlinuz
		initrd /live/initrd.img
		append boot=live components hostname=smd username=user
	label hunter-toram
		menu label Start SMD Linux Live entirely in ^RAM (needs ~2 GB RAM)
		linux /live/vmlinuz
		initrd /live/initrd.img
		append @APPEND_LIVE@ toram
	label hunter-hdd
		menu label ^Boot from the first hard disk
		localboot 0x80
	# Hardware detection tool from syslinux; the memtest entry is added by
	# live-build only when a memtest image is present (it is not here).
	include utilities.cfg
menu end

menu clear
