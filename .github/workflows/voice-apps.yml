name: voice-apps

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run whose ISO artifact should be tested
        required: true
        type: string
      mode:
        description: Firmware
        required: false
        default: uefi
        type: choice
        options: [uefi, bios]

jobs:
  voice:
    name: Voice Typing and Jellyfin (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf socat tesseract-ocr \
            imagemagick python3-venv python3-pip
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" -q install --upgrade pip
          "$HOME/venv/bin/pip" -q install pytesseract pillow
          ls -l /dev/kvm || echo "no /dev/kvm, using TCG"

      - name: Fetch the ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" --name iso --repo "${{ github.repository }}" --dir iso
          ls -lh iso/
          cd iso && sha256sum -c SMD-Linux-v1.5.0-amd64.iso.sha256

      - name: Exercise Voice Typing and the Jellyfin client
        run: |
          chmod +x tools/ci/voice-apps.py
          "$HOME/venv/bin/python" tools/ci/voice-apps.py \
            iso/SMD-Linux-v1.5.0-amd64.iso out "${{ inputs.mode }}"
        # Starting the live session, dictating a known recording and opening
        # the client takes about 20 minutes on TCG; a stall must still fail.
        timeout-minutes: 70

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-apps-${{ inputs.mode }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
