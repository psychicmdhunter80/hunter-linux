name: inspect-iso

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run whose ISO artifact should be inspected
        required: true
        type: string

jobs:
  inspect:
    name: Inspect the built image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools p7zip-full

      - name: Fetch the ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" --name iso --repo "${{ github.repository }}" --dir iso
          ls -lh iso/

      - name: Unpack and inspect
        run: |
          chmod +x tools/ci/inspect-iso.sh
          tools/ci/inspect-iso.sh iso/SMD-Linux-v*-amd64.iso work 2>&1 | tee inspect.log

      - name: Boot menu and bootloader files
        run: |
          echo "===== ISO tree ====="
          xorriso -indev iso/SMD-Linux-v*-amd64.iso -find / -maxdepth 2 2>/dev/null \
            | head -60 || true
          echo
          echo "===== isolinux config on the ISO ====="
          xorriso -osirrox on -indev iso/SMD-Linux-v*-amd64.iso \
            -extract /isolinux/isolinux.cfg work/isolinux.cfg >/dev/null 2>&1
          cat work/isolinux.cfg 2>/dev/null || echo "not found"
          for f in live.cfg menu.cfg stdmenu.cfg; do
            xorriso -osirrox on -indev iso/SMD-Linux-v*-amd64.iso \
              -extract "/isolinux/$f" "work/$f" >/dev/null 2>&1
            echo "--- $f"; cat "work/$f" 2>/dev/null
          done
          echo "===== grub config on the ISO ====="
          xorriso -osirrox on -indev iso/SMD-Linux-v*-amd64.iso \
            -extract /boot/grub/grub.cfg work/grub.cfg >/dev/null 2>&1
          sed -n '1,80p' work/grub.cfg 2>/dev/null
