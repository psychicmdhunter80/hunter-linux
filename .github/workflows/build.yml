name: build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Restore file modes
        run: |
          chmod +x build.sh auto/config tools/ci/*.sh tools/ci/*.py
          chmod +x config/hooks/live/*.hook.chroot
          chmod +x config/includes.chroot/usr/local/bin/* \
                   config/includes.chroot/usr/local/sbin/*

      - name: Build the build container
        run: docker build --network host -t hunter-build:1.0 .

      - name: Check the sources
        run: python3 tools/verify-project.py

      - name: Build the ISO
        run: |
          # Without pipefail the `| tee build.log` below hides a failed build:
          # the step would succeed on tee's exit status alone.
          set -o pipefail
          sudo docker run --rm --privileged --network host \
            -v "$PWD:/build" -w /build \
            hunter-build:1.0 sh -c './build.sh native' 2>&1 | tee build.log
          # The container runs as root; give the workspace back to the runner
          # user so later steps can write checksums and upload artefacts.
          sudo chown -R "$(id -u):$(id -g)" .
          test -f SMD-Linux-v1.4-amd64.iso

      - name: Check the packed files
        run: |
          set -euo pipefail
          iso=$(ls SMD-Linux-v1.4-amd64.iso)
          mkdir -p /tmp/packed
          # Pull the squashfs out of the ISO and read the files that must be LF.
          sudo mount -o loop,ro "$iso" /mnt 2>/dev/null || \
            bsdtar -xf "$iso" -C /tmp/packed
          root=/mnt
          if [ ! -f /mnt/live/filesystem.squashfs ]; then
            root=/tmp/packed
          fi
          squash=$(find "$root" -name 'filesystem.squashfs' | head -1)
          test -n "$squash"
          sudo unsquashfs -o 4096 -d /tmp/squash "$squash" >/dev/null || \
            unsquashfs -d /tmp/squash "$squash" >/dev/null
          for f in etc/skel/.config/i3/config \
                   usr/local/bin/hunter-applets \
                   usr/local/bin/hunter-autotile \
                   usr/local/sbin/hunter-audio-hw; do
            if grep -q $'\r' "/tmp/squash/$f"; then
              echo "CRLF inside the image: $f" >&2
              exit 1
            fi
            echo "LF ok: $f"
          done

      - name: Inspect the result
        if: always()
        run: |
          ls -lh *.iso || true
          if ls *.iso >/dev/null 2>&1; then
            sha256sum *.iso > SMD-Linux-v1.4-amd64.iso.sha256
            cat SMD-Linux-v1.4-amd64.iso.sha256
            file *.iso
          fi

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            SMD-Linux-v1.4-amd64.iso
            SMD-Linux-v1.4-amd64.iso.sha256
          retention-days: 7
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
