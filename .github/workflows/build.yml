name: build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Restore file modes
        run: |
          chmod +x build.sh auto/config tools/ci/*.sh tools/ci/*.py
          chmod +x config/hooks/live/*.hook.chroot
          chmod +x config/includes.chroot/usr/local/bin/* \
                   config/includes.chroot/usr/local/sbin/*

      - name: Build the build container
        run: docker build --network host -t hunter-build:1.0 .

      - name: Check the sources
        run: python3 tools/verify-project.py

      - name: The artwork matches the version
        run: |
          set -euo pipefail
          # Every picture is generated from VERSION by tools/make-assets.py.
          # Regenerate into a scratch tree and compare: a checkout whose
          # committed artwork differs would ship a picture carrying an older
          # version, which is how the 1.5.0 installer showed 1.4.1 artwork.
          rm -rf /tmp/assets && mkdir -p /tmp/assets
          SMD_ASSET_ROOT=/tmp/assets python3 tools/make-assets.py
          mismatches=0
          while IFS= read -r generated; do
            rel=${generated#/tmp/assets/}
            if ! cmp -s "$generated" "$rel"; then
              echo "artwork does not match the version: $rel" >&2
              mismatches=1
            fi
          done < <(find /tmp/assets -name '*.png')
          test "$mismatches" -eq 0
          echo "artwork matches VERSION=$(tr -d '[:space:]' < VERSION)"

      - name: Build the ISO
        run: |
          # Without pipefail the `| tee build.log` below hides a failed build:
          # the step would succeed on tee's exit status alone.
          set -o pipefail
          sudo docker run --rm --privileged --network host \
            -v "$PWD:/build" -w /build \
            hunter-build:1.0 sh -c './build.sh native' 2>&1 | tee build.log
          # The container runs as root; give the workspace back to the runner
          # user so later steps can write checksums and upload artefacts.
          sudo chown -R "$(id -u):$(id -g)" .
          ISO="SMD-Linux-v$(tr -d '[:space:]' < VERSION)-amd64.iso"
          test -f "$ISO" || { echo "the build did not produce $ISO" >&2; exit 1; }

      - name: Check the packed files
        run: |
          set -euo pipefail
          iso="SMD-Linux-v$(tr -d '[:space:]' < VERSION)-amd64.iso"
          mkdir -p /tmp/iso
          sudo mount -o loop,ro "$iso" /tmp/iso
          squash=/tmp/iso/live/filesystem.squashfs
          test -f "$squash"
          rm -rf /tmp/squash && mkdir -p /tmp/squash
          # Only the files under test, so no device nodes are created.
          unsquashfs -no-progress -d /tmp/squash "$squash" \
            etc/skel/.config/i3/config \
            usr/local/bin/hunter-applets \
            usr/local/bin/hunter-autotile \
            usr/local/sbin/hunter-audio-hw
          for f in etc/skel/.config/i3/config \
                   usr/local/bin/hunter-applets \
                   usr/local/bin/hunter-autotile \
                   usr/local/sbin/hunter-audio-hw; do
            if grep -q $'\r' "/tmp/squash/$f"; then
              echo "CRLF inside the image: $f" >&2
              exit 1
            fi
            echo "LF ok: $f"
          done
          # The two clients added in 1.5 are not Debian packages, so their
          # presence is proved from the image itself: a configuration
          # directory is not the program.
          unsquashfs -no-progress -l "$squash" > /tmp/squash-list.txt
          for want in \
              opt/jellyfin-mpv-shim/bin/jellyfin-mpv-shim \
              usr/share/applications/jellyfin-mpv-shim.desktop \
              usr/local/bin/hunter-dictation \
              usr/share/applications/smd-dictation.desktop \
              usr/share/nerd-dictation/nerd-dictation \
              usr/share/vosk/vosk-model-small-en-us-0.15/conf/model.conf; do
            if ! grep -q "$want" /tmp/squash-list.txt; then
              echo "missing from the image: $want" >&2
              exit 1
            fi
            echo "in the image: $want"
          done
          sudo umount /tmp/iso

      - name: Inspect the result
        if: always()
        run: |
          ls -lh *.iso || true
          if ls *.iso >/dev/null 2>&1; then
            iso="SMD-Linux-v$(tr -d '[:space:]' < VERSION)-amd64.iso"
            sha256sum "$iso" > "$iso.sha256"
            cat "$iso.sha256"
            file *.iso
          fi

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            SMD-Linux-v*-amd64.iso
            SMD-Linux-v*-amd64.iso.sha256
          retention-days: 7
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore
