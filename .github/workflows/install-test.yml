name: install-test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run whose ISO artifact should be installed
        required: true
        type: string
      firmware:
        description: Firmware to install under
        required: false
        default: uefi
        type: choice
        options: [uefi, bios]
      explore:
        description: Only click through the pages and capture them
        required: false
        default: "0"
        type: string
      diag:
        description: Stop after probing the installed bootloader
        required: false
        default: "0"
        type: string

jobs:
  install:
    name: Install and boot (${{ inputs.firmware }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf socat tesseract-ocr \
            imagemagick python3-venv python3-pip
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" -q install --upgrade pip
          "$HOME/venv/bin/pip" -q install vncdotool pytesseract pillow
          ls -l /dev/kvm || echo "no /dev/kvm, using TCG"

      - name: Fetch the ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" --name iso --repo "${{ github.repository }}" --dir iso
          ls -lh iso/
          cd iso && sha256sum -c SMD-Linux-v1.4-amd64.iso.sha256

      - name: Install to a virtual disk and boot the result
        env:
          EXPLORE: ${{ inputs.explore }}
          DIAG: ${{ inputs.diag }}
        run: |
          chmod +x tools/ci/install-test.py
          "$HOME/venv/bin/python" tools/ci/install-test.py \
            iso/SMD-Linux-v1.4-amd64.iso out "${{ inputs.firmware }}"
        timeout-minutes: 150

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test-${{ inputs.firmware }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
