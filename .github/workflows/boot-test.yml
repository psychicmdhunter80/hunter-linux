name: boot-test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run whose ISO artifact should be tested
        required: true
        type: string
      mode:
        description: Which firmware to test, or both
        required: false
        default: both
        type: choice
        options: [both, bios, uefi]
      panel_diag:
        description: Reset the panel config and capture diagnostics
        required: false
        default: "0"
        type: string
      diag:
        description: Diagnose the boot screen (1s frames, plymouth debug, then stop)
        required: false
        default: "0"
        type: string

jobs:
  boot:
    name: Live boot (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.mode == 'both' && '["bios","uefi"]' || format('["{0}"]', inputs.mode)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf imagemagick
          ls -l /dev/kvm || echo "no /dev/kvm, using TCG"

      - name: Fetch the ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" --name iso --repo "${{ github.repository }}" --dir iso
          ls -lh iso/
          cd iso && sha256sum -c SMD-Linux-v*-amd64.iso.sha256

      - name: Extract the ISO's own kernel and initramfs (diagnosis)
        if: inputs.diag == '1'
        run: |
          sudo mkdir -p /mnt/smd
          sudo mount -o loop,ro iso/SMD-Linux-v*-amd64.iso /mnt/smd
          cp /mnt/smd/live/vmlinuz-* kernel
          cp /mnt/smd/live/initrd.img-* initrd
          sudo umount /mnt/smd
          ls -lh kernel initrd

      - name: Boot and test the live system
        env:
          PANEL_DIAG: ${{ inputs.panel_diag }}
          BOOT_DIAG: ${{ inputs.diag }}
          BOOT_APPEND: ${{ inputs.diag == '1' && 'findiso=/dev/sr0 plymouth.debug=stream:/dev/ttyS0 ignore_loglevel' || '' }}
        run: |
          chmod +x tools/ci/boot-test.py
          if [ "${{ inputs.diag }}" = "1" ]; then
            export BOOT_KERNEL="$PWD/kernel" BOOT_INITRD="$PWD/initrd"
          fi
          python3 tools/ci/boot-test.py iso/SMD-Linux-v*-amd64.iso \
            "${{ matrix.mode }}" "out-${{ matrix.mode }}"
        timeout-minutes: 60

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-${{ matrix.mode }}
          path: out-${{ matrix.mode }}/
          retention-days: 7
          if-no-files-found: warn
